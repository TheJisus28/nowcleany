# Development services. Run from the repo root with `docker compose up -d` (see ../compose.yaml).
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      # Owner role: only migrate.ts uses it. The API connects with one role per module (M1).
      POSTGRES_USER: ${POSTGRES_USER:-nowcleanny_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-nowcleanny}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
