version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them (matches pnpm's minimumReleaseAge spirit).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*', 'nestjs-*', '@nestjs-cls/*']
      lint-and-test:
        patterns:
          ['eslint', '@eslint/*', 'typescript-eslint', 'prettier', 'vitest', 'dependency-cruiser']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /ops
    schedule:
      interval: weekly
